# Environnement de DEV LOCAL uniquement : jamais deploye.
# Source de verite du deploiement = gitops-platform (Argo CD). Memes conventions ici pour la parite dev/prod :
# image MySQL sclorg (variante CentOS Stream de rhel9/mysql-84 ; Sandbox encore en 8.0 jusqu'a EDA8), meme nom d'hote,
# memes variables DB_*.
#   Base seule (API lancee depuis l'IDE) : docker compose -f local/compose.yaml up -d
#   Base + API (jar construit par mvn package) : docker compose -f local/compose.yaml --profile app up -d --build
name: donation-api-local

services:
  donation-api-mysql:
    # Epinglee par digest (tag c9s) : meme image a chaque poste, mise a jour explicite
    # Montee 8.0 -> 8.4 automatique et irreversible sur un volume existant : sauvegarder avant (ADR 0037)
    image: quay.io/sclorg/mysql-84-c9s@sha256:5ba05d8f6e1261e02ff6fa8d19ea46e1c9a22dd12ecec557f4e6a9dcb011880e
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME absent - copier local/.env.example en local/.env}
      MYSQL_USER: ${DB_USER:?DB_USER absent - copier local/.env.example en local/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD absent - copier local/.env.example en local/.env}
      # Pas de MYSQL_ROOT_PASSWORD : root limite au socket local, comme sur OpenShift
    ports:
      # Expose uniquement sur la machine locale (pas sur le reseau)
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql/data
    healthcheck:
      # Meme controle que la readinessProbe OpenShift. MYSQL_PWD : mot de passe hors de la ligne de commande (ps).
      # $$ = echappement Compose : la variable est resolue dans le conteneur, pas a l'interpolation.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin -u \"$$MYSQL_USER\" -h 127.0.0.1 ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  donation-api:
    # Optionnel (profil "app") : l'API conteneurisee avec le MEME Dockerfile que la CI
    profiles: [app]
    build:
      context: ..
      dockerfile: cicd/openshift/Dockerfile
      args:
        JAR_FILE: target/*.jar
    env_file: .env
    environment:
      # Dans le reseau compose : nom de service + port interne (identique a OpenShift)
      DB_HOST: donation-api-mysql
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      donation-api-mysql:
        condition: service_healthy

volumes:
  mysql-data:
